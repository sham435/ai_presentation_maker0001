name: Electron E2E

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron app
        run: npm run build
      - name: Playwright Electron acceptance tests
        run: npm run test:e2e
      - name: Upload E2E reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-reports
          path: |
            test-results/**
            playwright-report/**
            artifacts/**
          if-no-files-found: ignore

  verify-all:
    name: verify-all
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run every deterministic verification command
        run: npm run verify:all
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-all-reports
          path: |
            test-results/**
            playwright-report/**
            artifacts/**
          if-no-files-found: ignore

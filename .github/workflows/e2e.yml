name: Electron E2E

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron app
        run: npm run build
      - name: Startup, Offline Preview and settings workflow
        run: npm run test:e2e
      - name: Playwright acceptance tests when configured
        run: |
          if [ -f playwright.config.ts ]; then
            npx playwright test
          else
            echo "playwright.config.ts not present; deterministic E2E harness already completed"
          fi
      - name: Upload E2E reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            test-results/**
            playwright-report/**
            artifacts/**
          if-no-files-found: ignore

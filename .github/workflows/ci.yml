name: CI Verification

on:
  push:
    branches: [main, "feat/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Golden prompt quality gates
        run: npm run test:golden
      - name: 30-slide load and memory tests
        run: npm run test:load
      - name: IPC security and credential-exposure tests
        run: npm run test:security
      - name: Electron build
        run: npm run build
      - name: Smoke build
        run: node scripts/smoke-build.mjs
      - name: Verify command surface
        run: npm pkg get scripts.test:unit scripts.test:integration scripts.test:golden scripts.test:e2e scripts.test:visual scripts.test:load scripts.test:security scripts.verify scripts.verify:all scripts.eval:live

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Unsafe dependency detector
        run: npm ls --omit=dev --depth=0

name: Visual Regression

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: visual
    runs-on: macos-26
    env:
      VISUAL_BASELINE_MODE: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Electron app
        run: npm run build
      - name: Verify UI, template gallery, settings modal and five slide roles
        run: npm run test:visual
      - name: Verify approved PDF page screenshot baselines
        run: node -e "const fs=require('fs'); const roles=['cover','catalog','chapter','content','end']; for (const r of roles) { const p='tests/visual/baselines/png/pdf-page-'+r+'.png'; if (!fs.existsSync(p)) throw new Error('Missing approved PDF page baseline: '+p) } console.log('approved PDF page baselines:', roles.length)"
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: visual-diffs
          path: |
            artifacts/visual/*.png
            test-results/**
          if-no-files-found: ignore

# Approved screenshot baselines are never overwritten automatically.
